[package]
name = "ass"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# Library (auto-discovered):
#   ass         src/lib.rs             code shared by the browser and the helper
#
# Binaries (auto-discovered):
#   ass         src/main.rs            the browser process
#   ass_helper  src/bin/ass_helper.rs  sandboxed renderer/GPU/utility processes
#   bundle      src/bin/bundle.rs      dev tool that assembles Ass.app

[dependencies]
# Pinned exactly: each cef release maps to one Chromium build. Bump on purpose.
cef = { version = "=156.7.0", default-features = false, features = [
    "sandbox",
    "build-util",
] }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
] }
semver = "1"
# Strict JSON parsing of shell API requests, and JSON encoding of the replies.
# Both were already in the build through cef's `build-util` feature; pinned to
# the versions in Cargo.lock.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Parses addresses: what the user types, and the host shown for a page with no
# title. Already in the build through cef's `build-util` feature; pinned to the
# version in Cargo.lock.
url = "=2.5.9"
