<!doctype html>
<meta charset="utf-8">
<title>Ass app icon</title>
<!--
  Draws the macOS app icon at every pixel size the .icns holds and writes each as a base64 PNG
  into #out, one line "png:<size>:<data>". build.sh loads this page in headless Chrome and packs
  the result. ?variant=light draws the white plate with the black mark (a preview, not shipped).
-->
<pre id="out"></pre>
<script>
(() => {
  'use strict';

  // ---- Copied verbatim from design/shell-prototype.html, lines 343, 358, 363, 386-387, 389-425,
  // 427-428, 430-449, 451-474, 476-497, 499-506 and 519-525. Do not edit it here: change the
  // prototype, then copy the same lines again.
  const TAU = Math.PI * 2;
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v * t + B[i] * (1 - t))).join(',') + ')'; };
  const norm = (x, y, z) => { const l = Math.hypot(x, y, z) || 1; return [x / l, y / l, z / l]; };
  const KEY_LIGHT = norm(-0.24, -0.28, 0.93);
  // The form: a bowl on top of two lobes,
  // 1.18 times as wide as tall. Each part is a superellipse and all three meet at the widest point, so
  // the sides run straight from one into the next. depth is how deep the cleft is, as a share of the height.
  const CLEFT = 0.15;
  const forms = {};
  function form(depth) {
    if (forms[depth]) return forms[depth];
    const H = HEIGHT, h = 0.4 * H, b = H - h, pt = 2.4, pb = 2.5;
    const ratio = (1 - (1 - depth / 0.4) ** pt) ** (1 / pt), c = ratio / (1 + ratio), a = 1 - c;
    const y0 = h - H / 2;
    const inside = (x, y) => (y >= y0
      ? Math.abs(x) ** pb + ((y - y0) / b) ** pb <= 1
      : (Math.abs(Math.abs(x) - c) / a) ** pt + ((y0 - y) / h) ** pt <= 1);
    const pw = (v, p) => Math.sign(v) * Math.abs(v) ** (2 / p);
    const N = 160, lobe = [];
    let outline = [];
    for (let i = 0; i < N; i++) { const u = (i / N) * Math.PI; outline.push([pw(Math.cos(u), pb), y0 + b * pw(Math.sin(u), pb)]); }
    const end = Math.acos(-((c / a) ** (pt / 2)));
    for (let i = 0; i <= N; i++) { const u = (i / N) * end; lobe.push([c + a * pw(Math.cos(u), pt), y0 - h * pw(Math.sin(u), pt)]); }
    for (const [x, y] of lobe) outline.push([-x, y]);
    for (let i = N - 1; i > 0; i--) outline.push(lobe[i]);
    // Built as in the sketch, lobes up, then turned over: the cleft is at the bottom.
    outline = outline.map(([x, y]) => [x, -y]);
    const within = (x, y) => inside(x, -y);
    // The nearest point on the outline, and how far the innermost point is from it. Both are for shading.
    const near = (x, y) => {
      let best = 9, bx = 0, by = 0;
      for (const q of outline) { const d = (q[0] - x) ** 2 + (q[1] - y) ** 2; if (d < best) { best = d; bx = q[0]; by = q[1]; } }
      return [Math.sqrt(best), bx, by];
    };
    let deepest = 0;
    for (let x = -1; x <= 1; x += 0.05) for (let y = -1; y <= 1; y += 0.05) if (within(x, y)) deepest = Math.max(deepest, near(x, y)[0]);
    return (forms[depth] = { outline, inside: within, near, deepest, height: H });
  }
  const HEIGHT = 2 / 1.18;
  // How deep to cut the cleft so it still shows when the drawing is coarse: never less than the sketch's.
  const cleftFor = (least) => Math.min(0.3, Math.max(CLEFT, Math.round((least / HEIGHT) * 100) / 100));
  // Sample points spread evenly over a disc, used to measure how much of a dot's cell the form covers.
  const SAMPLES = Array.from({ length: 40 }, (_, i) => { const r = Math.sqrt((i + 0.5) / 40), a = i * 2.399963229728653; return [r * Math.cos(a), r * Math.sin(a)]; });
  // The three grids. Each calls add(x, y) for every point of a grid whose step is 2 / n.
  function grid(pattern, n, add) {
    const s = 2 / n;
    if (pattern === 'spiral') {
      const count = Math.round(n * n * 1.1);
      for (let i = 0; i < count; i++) {
        const r = Math.sqrt((i + 0.5) / count) * 1.19, a = i * 2.399963229728653;
        add(r * Math.cos(a), r * Math.sin(a));
      }
    } else if (pattern === 'matrix') {
      // A column gap runs down the middle, in line with the cleft.
      const m = n + 2;
      for (let i = -m; i <= m; i++) for (let j = -m; j <= m; j++) add((i + 0.5) * s, (j + 0.5) * s);
    } else {
      // Honeycomb: every row sits half a step across from the row above. Of the grids tried,
      // this is the one that keeps the round top round; a diagonal grid cuts it to a point.
      const m = n + 3, rise = s * Math.sqrt(3) / 2;
      for (let j = -m; j <= m; j++) for (let i = -m; i <= m; i++) add((i + (j & 1 ? 0.5 : 0)) * s, j * rise);
    }
  }
  const cache = {};
  // Dot centers on and around the form. Each dot carries the direction its patch of surface faces,
  // as if the outline were inflated like a cushion, and how much of its cell the form covers.
  // A dot on the edge is drawn smaller in that proportion, which is what keeps the outline true.
  function layout(pattern, n) {
    const key = pattern + n;
    if (cache[key]) return cache[key];
    const pts = [];
    const s = 2 / n, cell = s * (pattern === 'honeycomb' ? 0.525 : 0.5642);
    // The cleft is at least two rows of dots deep, or it would not show.
    const F = form(cleftFor(1.75 * s));
    const add = (x, y) => {
      if (Math.abs(x) > 1 + s || Math.abs(y) > HEIGHT / 2 + s) return;
      let cover = 0;
      for (const [dx, dy] of SAMPLES) if (F.inside(x + dx * cell, y + dy * cell)) cover++;
      cover /= SAMPLES.length;
      if (cover < 0.2) return;
      const [dist, bx, by] = F.near(x, y);
      const within = F.inside(x, y), q = within ? 1 - Math.min(1, dist / F.deepest) : 1, out = (within ? -q : q) / (dist || 1);
      pts.push([x, y, (x - bx) * out, (y - by) * out, Math.sqrt(Math.max(0, 1 - q * q)), cover]);
    };
    grid(pattern, n, add);
    return (cache[key] = { pts, rmax: s * 0.5 });
  }
  // The form in dots. With lights, each dot's area follows how much light reaches it.
  // Without (flat), every dot is full size and only the edge dots shrink.
  function dotted(ctx, cx, cy, R, o) {
    const { pts, rmax } = layout(o.pattern || theme.pattern, o.n);
    const square = (o.shape || theme.shape) === 'square';
    const lights = o.lights || [KEY_LIGHT], amb = o.amb ?? 0.3, fill = o.fill ?? 0.88;
    ctx.beginPath();
    for (const [x, y, nx, ny, nz, cover] of pts) {
      let level = cover;
      if (!o.flat) {
        let lit = 0;
        for (const l of lights) lit = Math.max(lit, nx * l[0] + ny * l[1] + nz * l[2]);
        level *= amb * (0.5 + 0.5 * nz) + (1 - amb) * lit;
      }
      const r = rmax * R * Math.sqrt(Math.min(1, level)) * fill;
      if (r < 0.3) continue;
      const px = cx + x * R, py = cy + y * R;
      if (square) ctx.rect(px - r * 0.88, py - r * 0.88, r * 1.76, r * 1.76);
      else { ctx.moveTo(px + r, py); ctx.arc(px, py, r, 0, TAU); }
    }
    ctx.fill();
  }
  // The form filled in. Used under 96 pixels, where dots would blur. The cleft is cut deeper
  // as the drawing gets smaller, so it is never less than three and a half pixels deep.
  function solid(ctx, cx, cy, R) {
    ctx.beginPath();
    form(cleftFor(3.5 / R)).outline.forEach(([x, y], i) => (i ? ctx.lineTo(cx + x * R, cy + y * R) : ctx.moveTo(cx + x * R, cy + y * R)));
    ctx.closePath();
    ctx.fill();
  }
  // The mark is always the same drawing, whatever the theme's art uses: dots when it is at least
  // 80 pixels wide (a 96 pixel icon), filled in below that. R is half its width.
  const MARK = { pattern: 'honeycomb', shape: 'round', n: 11 };
  function mark(ctx, cx, cy, R) {
    if (R < 40) solid(ctx, cx, cy, R);
    else dotted(ctx, cx, cy, R, { ...MARK, flat: true });
  }
  // ---- End of the copy.

  // The prototype's default pair. The shipped icon is a black plate with a white mark.
  const INK = '#000000', GROUND = '#ffffff';
  const light = new URLSearchParams(location.search).get('variant') === 'light';
  const plateColor = light ? GROUND : INK, markColor = light ? INK : GROUND;
  // A one-pixel line inside the plate's edge, mixed from the two colours, so the edge reads on a
  // surface close to the plate's own colour. The share is how much of the mark's colour is in it.
  const EDGE = light ? 0.16 : 0;

  // Apple's macOS app icon grid, on a 1024 canvas: a plate of 824 centred, continuous corners of
  // radius 185.4. The mark fills 84% of the plate's width, as in the prototype's own app icon
  // (at 88% the side dots crowd the edge).
  const CANVAS = 1024, PLATE = 824, RADIUS = 185.4, MARK_SHARE = 0.84;
  const SIZES = [16, 32, 64, 128, 256, 512, 1024];

  // One corner of a continuous-corner square, in radii from the corner along its two edges: the curve
  // starts 1.528665 radii from the corner. These are the widely published control points that
  // reproduce Apple's shape; they are not taken from an Apple file.
  const CORNER = [[1.52866483, 0], [1.08849323, 0], [0.86840689, 0], [0.66993427, 0.065496],
    [0.372823, 0.16905899], [0.16906011, 0.372823], [0.06549569, 0.66993493],
    [0, 0.86840701], [0, 1.08849299], [0, 1.52866483]];
  function plate(ctx, x, y, w, r) {
    // Each corner: its point, the way back along the edge that arrives, the way along the edge that leaves.
    const corners = [[x + w, y, -1, 0, 0, 1], [x + w, y + w, 0, -1, -1, 0], [x, y + w, 1, 0, 0, -1], [x, y, 0, 1, 1, 0]];
    ctx.beginPath();
    for (const [px, py, ax, ay, bx, by] of corners) {
      const p = CORNER.map(([u, v]) => [px + (u * ax + v * bx) * r, py + (u * ay + v * by) * r]);
      ctx.lineTo(...p[0]);
      for (let i = 1; i < p.length; i += 3) ctx.bezierCurveTo(...p[i], ...p[i + 1], ...p[i + 2]);
    }
    ctx.closePath();
  }

  // One image of S by S real pixels. Up to 128 the mark is filled in; from 256 up mark() draws it in
  // dots. The 128 image would pass the size rule (its mark is 87 pixels wide), but macOS shrinks that
  // image for every icon from 36 to 48 points on a 2x screen, the Dock among them, and the dots then
  // fall under the rule and blur. Seen on macOS 27.2.
  function icon(S) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = S;
    // The plate's edge falls on whole pixels: the margin is rounded down, as in the plate macOS 27.2
    // draws for an app icon (measured at 16, 32, 64, 128, 256 and 1024: margins 1, 3, 6, 12, 25, 100).
    const ctx = canvas.getContext('2d'), at = Math.floor(((CANVAS - PLATE) / 2) * (S / CANVAS)), side = S - 2 * at;
    ctx.fillStyle = plateColor;
    plate(ctx, at, at, side, (RADIUS * side) / PLATE);
    ctx.fill();
    if (EDGE) {
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = mix(markColor, plateColor, EDGE);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = markColor;
    (S <= 128 ? solid : mark)(ctx, S / 2, S / 2, (MARK_SHARE * side) / 2);
    return canvas.toDataURL('image/png').split(',')[1];
  }

  document.getElementById('out').textContent = SIZES.map((S) => 'png:' + S + ':' + icon(S)).join('\n');
})();
</script>
